services:
  master:
    image: locustio/locust:2.43.4
    ports:
      - "8089:8089"
    command: [ "-f", "/opt/locust/traffictest.py", "--master", "-H", "http://host.docker.internal:8000" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/tests/load_test/traffictest.py:/opt/locust/traffictest.py
    networks:
      - locust

  worker:
    image: locustio/locust:2.43.4
    command: [ "-f", "/opt/locust/traffictest.py", "--worker", "--master-host", "master" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/tests/load_test/traffictest.py:/opt/locust/traffictest.py
    networks:
      - locust

networks:
  locust: