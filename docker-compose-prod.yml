services:
  nginx:
    container_name: nginx-cinema
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
      - "5555:5555"
    env_file:
      - docker/nginx/.env
    depends_on:
      flower:
        condition: service_started
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cinema_network

  db:
    container_name: postgres-cinema
    image: postgres:18.3-alpine3.23
    restart: always
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_cinema_data:/var/lib/postgresql/data
    networks:
      - cinema_network

  pgadmin:
    container_name: pgadmin-cinema
    image: dpage/pgadmin4:9.13
    restart: always
    ports:
      - "3333:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_cinema_data:/var/lib/pgadmin
    networks:
      - cinema_network

  app:
    container_name: backend-cinema
    image: online-cinema-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: [ "sh", "/scripts/run_web_server_prod.sh" ]
    environment:
      - ENVIRONMENT=production
      - BASE_URL
      - SECRET_KEY_ACCESS
      - SECRET_KEY_REFRESH
      - JWT_SIGNING_ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - REFRESH_TOKEN_EXPIRE_MINUTES
      - POSTGRES_DB
      - POSTGRES_DB_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
      - MAIL_SERVER
      - MAIL_PORT
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_FROM
      - MAIL_FROM_NAME
      - MAIL_STARTTLS
      - MAIL_SSL_TLS
      - MINIO_HOST
      - MINIO_PORT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_STORAGE
      - STRIPE_PUBLISHABLE_KEY
      - STRIPE_SECRET_KEY
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-mc:
        condition: service_completed_successfully
    networks:
      - cinema_network

  migrator:
    container_name: alembic-cinema
    image: online-cinema-backend:latest
    command: [ "sh", "/scripts/run_migration.sh" ]
    environment:
      - POSTGRES_DB
      - POSTGRES_DB_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cinema_network

  redis:
    container_name: redis-cinema
    image: redis:alpine3.23
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cinema_network

  celery-worker:
    container_name: celery-worker-cinema
    image: online-cinema-backend:latest
    restart: always
    command: [ "celery", "-A", "tasks.celery_app", "worker", "-l", "info" ]
    environment:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - cinema_network

  celery-beat:
    container_name: celery-beat-cinema
    image: online-cinema-backend:latest
    restart: always
    command: [ "celery", "-A", "tasks.celery_app", "beat", "-l", "info" ]
    environment:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - cinema_network

  flower:
    container_name: flower-cinema
    build:
      context: .
      dockerfile: docker/flower/Dockerfile
    restart: always
    environment:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - cinema_network

  mailhog:
    container_name: mailhog-cinema
    build:
      context: .
      dockerfile: ./docker/mailhog/Dockerfile
    restart: always
    ports:
      - "8025:8025"
    environment:
      - MH_AUTH_FILE=/mailhog.auth
      - MAILHOG_USER
      - MAILHOG_PASSWORD
    networks:
      - cinema_network

  minio:
    container_name: minio-cinema
    image: cgr.dev/chainguard/minio:latest
    restart: always
    command: [ "server", "/data", "--console-address", ":9001", "--address", ":9000" ]
    ports:
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_USE_SSL
    volumes:
      - minio_data:/data
    networks:
      - cinema_network

  minio-mc:
    container_name: minio-init
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    environment:
      - MINIO_HOST
      - MINIO_PORT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_STORAGE
    depends_on:
      minio:
        condition: service_started
    networks:
      - cinema_network

volumes:
  minio_data:
  postgres_cinema_data:
  pgadmin_cinema_data:

networks:
  cinema_network: