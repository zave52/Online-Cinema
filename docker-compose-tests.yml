services:
  app:
    container_name: backend-cinema-test
    build:
      context: .
      dockerfile: ./docker/tests/Dockerfile
    command: [ "-m", "e2e", "--maxfail=5", "--disable-warnings", "-v", "--tb=short" ]
    environment:
      - ENVIRONMENT=testing
      - MAIL_SERVER
      - MAIL_PORT
      - MAIL_FROM
      - MAIL_FROM_NAME
      - MAIL_STARTTLS
      - MAIL_SSL_TLS
      - MINIO_HOST
      - MINIO_PORT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_STORAGE
      - STRIPE_PUBLISHABLE_KEY
      - STRIPE_SECRET_KEY
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
      - RATE_LIMIT_ANONYMOUS
      - RATE_LIMIT_AUTHENTICATED
      - RATE_LIMIT_PERIOD
    depends_on:
      mailhog:
        condition: service_healthy
      minio:
        condition: service_started
      minio-mc:
        condition: service_completed_successfully
      celery-beat:
        condition: service_started
    networks:
      - cinema_network_test

  redis:
    container_name: redis-cinema-test
    image: redis:alpine3.23
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cinema_network_test

  celery-worker:
    container_name: celery-worker-cinema-test
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "celery", "-A", "tasks.celery_app", "worker", "-l", "info" ]
    environment:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cinema_network_test

  celery-beat:
    container_name: celery-beat-cinema-test
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "celery", "-A", "tasks.celery_app", "beat", "-l", "info" ]
    environment:
      - CELERY_BROKER_URL
      - CELERY_RESULT_BACKEND
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - cinema_network_test

  mailhog:
    container_name: mailhog-cinema-test
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cinema_network_test

  minio:
    container_name: minio-cinema-test
    image: cgr.dev/chainguard/minio:latest
    command: [ "server", "/data", "--console-address", ":9001", "--address", ":9000" ]
    ports:
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_USE_SSL
    volumes:
      - minio_data_test:/data
    networks:
      - cinema_network_test

  minio-mc:
    container_name: minio-init-test
    build:
      context: .
      dockerfile: docker/minio_mc/Dockerfile
    environment:
      - MINIO_HOST
      - MINIO_PORT
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
      - MINIO_STORAGE
    depends_on:
      minio:
        condition: service_started
    networks:
      - cinema_network_test

volumes:
  minio_data_test:

networks:
  cinema_network_test: