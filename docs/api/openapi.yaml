openapi: 3.1.0
info:
  title: Online Cinema API
  description: |2-

            # Online Cinema API Documentation

            ## Overview
            This API provides comprehensive functionality for an online cinema platform,
            including user management, movie catalog, shopping cart, orders, and payment processing.

            ## Features
            - **User Management**: Registration, authentication, profile management
            - **Movie Catalog**: Browse movies, view details, search and filter
            - **Shopping Cart**: Add/remove movies, manage cart contents
            - **Orders**: Create and manage movie purchases
            - **Payments**: Secure payment processing with Stripe integration
            - **Admin Functions**: User management and system administration

            ## Authentication
            The API uses JWT (JSON Web Tokens) for authentication.
            Most endpoints require a valid access token in the Authorization header.

            ## Error Handling
            The API returns standardized error responses
            with appropriate HTTP status codes and detailed error messages.

            ## Versioning
            This is version 1.0 of the API. All endpoints are prefixed with `/api/v1/`.

  version: 1.0.0
paths:
  /api/v1/accounts/register/:
    post:
      tags:
        - accounts
      summary: Register a new user
      description: >-
        Register a new user with email and password. Sends an activation email
        with a token.
      operationId: register_user_api_v1_accounts_register__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequestSchema'
        required: true
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponseSchema'
              example:
                id: 1
                email: user@example.com
                is_active: false
                created_at: '2024-01-01T00:00:00Z'
                group:
                  id: 1
                  name: user
        '409':
          description: User with this email already exists
          content:
            application/json:
              example:
                detail: A user with this email user@example.com already exists.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during user creation
          content:
            application/json:
              example:
                detail: An error occurred during user creation.
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/activate/resend/:
    post:
      tags:
        - accounts
      summary: Resend activation token
      description: >-
        Resend a new activation token to the user's email if the previous one
        expired.
      operationId: resend_activation_token_api_v1_accounts_activate_resend__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendActivationTokenRequestSchema'
        required: true
      responses:
        '200':
          description: Activation token resent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: >-
                  If your account exists and is not activated, you will receive
                  an email with instructions.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during token resend
          content:
            application/json:
              example:
                detail: An error occurred during resending activation token.
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/activate/:
    post:
      tags:
        - accounts
      summary: Activate user account
      description: Activate a user account using the activation token sent via email.
      operationId: activate_account_api_v1_accounts_activate__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserActivationRequestSchema'
        required: true
      responses:
        '200':
          description: User account activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: User account activated successfully.
        '400':
          description: Invalid or expired activation token or user already active
          content:
            application/json:
              examples:
                invalid_token:
                  summary: Invalid Token
                  value:
                    detail: Invalid or expired activation token.
                already_active:
                  summary: Already Active
                  value:
                    detail: User account is already active.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/password-reset/request/:
    post:
      tags:
        - accounts
      summary: Request password reset
      description: Request a password reset token to be sent to the user's email.
      operationId: >-
        request_password_reset_token_api_v1_accounts_password_reset_request__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestSchema'
        required: true
      responses:
        '200':
          description: Password reset token sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: >-
                  If you are registered, you will receive an email with
                  instructions.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/password-reset/complete/:
    post:
      tags:
        - accounts
      summary: Complete password reset
      description: Complete the password reset process using the token sent via email.
      operationId: reset_password_api_v1_accounts_password_reset_complete__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompleteRequestSchema'
        required: true
      responses:
        '200':
          description: Password reset completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: Password reset successfully.
        '400':
          description: Invalid email or token
          content:
            application/json:
              example:
                detail: Invalid email or token.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during password reset
          content:
            application/json:
              example:
                detail: An error occurred while resetting the password.
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/password-change/:
    post:
      tags:
        - accounts
      summary: Change password
      description: Change the user's password by providing the old and new password.
      operationId: change_password_api_v1_accounts_password_change__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestSchema'
        required: true
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: Password changed successfully.
        '400':
          description: New password same as current password
          content:
            application/json:
              example:
                detail: New password must be different from the current password.
        '401':
          description: Current password incorrect
          content:
            application/json:
              example:
                detail: Current password is incorrect.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during password change
          content:
            application/json:
              example:
                detail: An error occurred during password change.
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
  /api/v1/accounts/login/:
    post:
      tags:
        - accounts
      summary: User login
      description: Authenticate user and return JWT access and refresh tokens.
      operationId: login_user_api_v1_accounts_login__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequestSchema'
        required: true
      responses:
        '200':
          description: User successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponseSchema'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type: bearer
                user:
                  id: 1
                  email: user@example.com
                  is_active: true
                  created_at: '2024-01-01T00:00:00Z'
                  group:
                    id: 1
                    name: user
        '401':
          description: Invalid credentials
          content:
            application/json:
              example:
                detail: Invalid email or password
        '403':
          description: Account not activated
          content:
            application/json:
              example:
                detail: >-
                  Account is not activated. Please check your email for
                  activation link.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/logout/:
    post:
      tags:
        - accounts
      summary: User logout
      description: Logout user by deleting the refresh token.
      operationId: logout_user_api_v1_accounts_logout__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestSchema'
        required: true
      responses:
        '200':
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: Successfully logged out.
        '401':
          description: Invalid credentials or user not found/inactive
          content:
            application/json:
              examples:
                invalid_tokens:
                  summary: Invalid Tokens
                  value:
                    detail: Invalid or mismatched tokens
                not_found:
                  summary: User Not Found
                  value:
                    detail: User not found or inactive
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during logout
          content:
            application/json:
              example:
                detail: An error occurred during logout.
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
  /api/v1/accounts/refresh/:
    post:
      tags:
        - accounts
      summary: Refresh access token
      description: Obtain a new access token using a valid refresh token.
      operationId: refresh_access_token_api_v1_accounts_refresh__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestSchema'
        required: true
      responses:
        '200':
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponseSchema'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid refresh token
          content:
            application/json:
              example:
                detail: Invalid refresh token
        '401':
          description: Refresh token not found
          content:
            application/json:
              example:
                detail: Refresh token not found.
        '404':
          description: User not found
          content:
            application/json:
              example:
                detail: User not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  /api/v1/accounts/verify/:
    post:
      tags:
        - accounts
      summary: Verify access token
      description: Verify if a given access token is valid and not expired.
      operationId: verify_access_token_api_v1_accounts_verify__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequestSchema'
        required: true
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: Token valid.
        '401':
          description: Token invalid or expired
          content:
            application/json:
              example:
                detail: Token invalid or expired.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - HTTPBearer: [ ]
  '/api/v1/accounts/admin/users/{user_id}/change-group/':
    post:
      tags:
        - accounts
        - admin
        - accounts
      summary: Change user group (admin only)
      description: Change the group (role) of a user. Only accessible by admins.
      operationId: >-
        change_user_group_api_v1_accounts_admin_users__user_id__change_group__post
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGroupUpdateRequestSchema'
      responses:
        '200':
          description: User group successfully changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              example:
                message: User group successfully changed to admin
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Admin access required
          content:
            application/json:
              example:
                detail: Access denied. Admin privileges required.
        '404':
          description: User not found
          content:
            application/json:
              example:
                detail: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/accounts/admin/users/activate/:
    post:
      tags:
        - accounts
        - admin
        - accounts
      summary: Manually activate user (admin only)
      description: Manually activate a user account. Only accessible by admins.
      operationId: admin_activate_user_api_v1_accounts_admin_users_activate__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserManualActivationSchema'
        required: true
      responses:
        '200':
          description: User activated successfully or already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schemas__accounts__MessageResponseSchema'
              examples:
                activated:
                  summary: User Activated
                  value:
                    message: >-
                      User account for user@example.com has been manually
                      activated.
                already_active:
                  summary: Already Active
                  value:
                    message: User account for user@example.com is already active.
        '401':
          description: Authentication required
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Admin access required
          content:
            application/json:
              example:
                detail: Access denied. Admin privileges required.
        '404':
          description: User not found
          content:
            application/json:
              example:
                detail: User with email user@example.com not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Internal server error during activation
          content:
            application/json:
              example:
                detail: Failed to activate user account.
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
  '/api/v1/profiles/users/{user_id}/profile/':
    post:
      tags:
        - profiles
      summary: Create user profile
      description: Create a new profile for a user with avatar upload to S3 storage.
      operationId: create_profile_api_v1_profiles_users__user_id__profile__post
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: >-
                #/components/schemas/Body_create_profile_api_v1_profiles_users__user_id__profile__post
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseSchema'
              example:
                id: 1
                user_id: 1
                first_name: John
                last_name: Doe
                gender: MAN
                date_of_birth: '1990-01-01'
                info: Software developer from New York
                avatar: 'https://example-bucket.s3.amazonaws.com/avatars/1_profile.jpg'
        '400':
          description: User already has a profile
          content:
            application/json:
              example:
                detail: User already has a profile.
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You don't have permission to edit this profile.
        '422':
          description: Validation error
          content:
            application/json:
              example:
                detail:
                  - loc:
                      - body
                      - first_name
                    msg: field required
                    type: value_error.missing
        '500':
          description: Avatar upload failed
          content:
            application/json:
              example:
                detail: Failed to upload avatar. Please try again later.
    get:
      tags:
        - profiles
      summary: Get user profile
      description: >-
        Retrieve a user's profile. Users can only view their own profile unless
        they are admin.
      operationId: get_user_profile_api_v1_profiles_users__user_id__profile__get
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileRetrieveSchema'
              example:
                id: 1
                user_id: 1
                email: user@example.com
                first_name: John
                last_name: Doe
                gender: MAN
                info: Software developer from New York
                date_of_birth: '1990-01-01'
                avatar: 'https://example-bucket.s3.amazonaws.com/avatars/1_profile.jpg'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You don't have permission to view this profile.
        '404':
          description: Profile not found
          content:
            application/json:
              example:
                detail: Profile for this user not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
        - profiles
      summary: Update user profile
      description: >-
        Update a user's profile completely. Users can only update their own
        profile unless they are admin.
      operationId: update_profile_api_v1_profiles_users__user_id__profile__put
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: >-
                #/components/schemas/Body_update_profile_api_v1_profiles_users__user_id__profile__put
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseSchema'
              example:
                id: 1
                user_id: 1
                first_name: John
                last_name: Doe
                gender: MAN
                date_of_birth: '1990-01-01'
                info: Software developer from New York
                avatar: 'https://example-bucket.s3.amazonaws.com/avatars/1_profile.jpg'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You don't have permission to update this profile.
        '404':
          description: Profile not found
          content:
            application/json:
              example:
                detail: Profile for this user not found.
        '422':
          description: Validation error
          content:
            application/json:
              example:
                detail:
                  - loc:
                      - body
                      - first_name
                    msg: field required
                    type: value_error.missing
        '500':
          description: Avatar upload failed
          content:
            application/json:
              example:
                detail: Failed to upload avatar. Please try again later.
    patch:
      tags:
        - profiles
      summary: Patch user profile
      description: >-
        Partially update a user's profile. Users can only update their own
        profile unless they are admin.
      operationId: patch_profile_api_v1_profiles_users__user_id__profile__patch
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            title: User Id
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: >-
                #/components/schemas/Body_patch_profile_api_v1_profiles_users__user_id__profile__patch
      responses:
        '200':
          description: Profile patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseSchema'
              example:
                id: 1
                user_id: 1
                first_name: John
                last_name: Doe
                gender: MAN
                date_of_birth: '1990-01-01'
                info: Software developer from New York
                avatar: 'https://example-bucket.s3.amazonaws.com/avatars/1_profile.jpg'
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You don't have permission to update this profile.
        '404':
          description: Profile not found
          content:
            application/json:
              example:
                detail: Profile for this user not found.
        '422':
          description: Validation error
          content:
            application/json:
              example:
                detail:
                  - loc:
                      - body
                      - first_name
                    msg: ensure this value has at least 1 characters
                    type: value_error.any_str.min_length
        '500':
          description: Avatar upload failed
          content:
            application/json:
              example:
                detail: Failed to upload avatar. Please try again later.
  /api/v1/cinema/directors/:
    get:
      tags:
        - directors
        - moderator
        - directors
      summary: List directors
      description: >-
        Get a paginated list of all movie directors. Only moderators and admins
        can access.
      operationId: get_directors_api_v1_cinema_directors__get
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 10
            title: Per Page
      responses:
        '200':
          description: List of directors returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorListSchema'
              example:
                directors:
                  - id: 1
                    name: Frank Darabont
                  - id: 2
                    name: Francis Ford Coppola
                total_pages: 1
                total_items: 2
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                detail: Not authenticated
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: Access denied. Moderator or admin privileges required.
        '422':
          description: Validation error
          content:
            application/json:
              example:
                detail:
                  - loc:
                      - query
                      - page
                    msg: ensure this value is greater than or equal to 1
                    type: value_error.number.not_ge
    post:
      tags:
        - directors
        - moderator
        - directors
      summary: Create director
      description: >-
        Create a new movie director. Only moderators and admins can perform this
        action.
      operationId: create_director_api_v1_cinema_directors__post
      security:
        - HTTPBearer: [ ]
        - HTTPBearer: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameSchema'
      responses:
        '201':
          description: Director created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectorSchema'
